name: CI

on:
  push:
    branches: [main, master, fix/sonar-duplication-cleanup]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-analyze:
    name: Build, test y análisis SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar necesita todo el historial para detectar código nuevo

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (verifica tipos)
        run: npm run build

      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage

      - name: Configurar Node.js para el frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Validar tipos del frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Revisar estilo del frontend
        working-directory: frontend
        run: npm run lint

      - name: Compilar el frontend
        working-directory: frontend
        run: npm run build

      - name: Pruebas unitarias del frontend
        working-directory: frontend
        run: npm test

      - name: Análisis con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
